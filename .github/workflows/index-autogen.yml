name: Auto-generate Venera JSON catalogs

# On main, create a review PR containing only generated catalog files.
# Pull-request validation stays read-only in catalog-index.yml.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "shared/**"
      - ".generated/build-manifest.json"
      - "index.json"
      - "CATALOG.md"
      - "experiments/legacy-comic-sources/**"
      - "scripts/build/**"
      - "scripts/sync-index.js"
      - "scripts/config/release-authority.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/index-autogen.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-venera-catalog-main
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'mythic3011/venera-configs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate canonical manifest and plugin artifacts
        run: |
          npm run check:manifest
          npm run check-generated
      - name: Generate Venera catalogs
        run: |
          npm run build:catalogs
          npm run check:catalogs
      - name: Test catalog outputs and temporary source
        run: node --test tests/catalog-index.test.js tests/lanraragi.temporary.test.js
      - name: Detect generated catalog drift
        id: diff
        shell: bash
        run: |
          git add -- \
            index.json CATALOG.md \
            experiments/legacy-comic-sources/index.json \
            experiments/legacy-comic-sources/INDEX.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Catalog files are already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi
      - name: Upload generated catalog artifacts
        uses: actions/upload-artifact@v4
        with:
          name: venera-autogenerated-catalogs-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            index.json
            CATALOG.md
            experiments/legacy-comic-sources/index.json
            experiments/legacy-comic-sources/INDEX.md
      - name: Open or update generated catalog PR
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c automation/generated-venera-catalogs
          git commit -m "chore(catalog): regenerate Venera JSON indexes and READMEs"
          git push --force-with-lease origin \
            HEAD:refs/heads/automation/generated-venera-catalogs
          pr="$(gh pr list --state open --base main \
            --head automation/generated-venera-catalogs \
            --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            gh pr create \
              --base main \
              --head automation/generated-venera-catalogs \
              --title "chore(catalog): auto-regenerate Venera JSON indexes" \
              --body "Generated from already committed manifests and reviewed JS allowlists. Exactly four catalog outputs changed. No source JS, credentials, or release authority was modified. Review before merging."
          else
            echo "Updated existing generated-catalog PR #${pr}"
          fi
