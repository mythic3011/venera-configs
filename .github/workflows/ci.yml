name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Validate release authority config
        run: npm run validate:release-authority

      - name: Generate plugin artifacts
        run: npm run generate

      - name: Verify generated outputs
        run: npm run check-generated -- --ci

      - name: Run tests
        run: npm run test

      - name: Run runtime compatibility tests
        run: npm run test:runtime

      - name: Audit unsafe runtime code
        run: npm run audit:unsafe-runtime-code
