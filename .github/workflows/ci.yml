name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify generated ehentai output
        run: |
          cp ehentai.js /tmp/ehentai.js.before
          node scripts/build-source.js ehentai
          cmp /tmp/ehentai.js.before ehentai.js

      - name: Verify index metadata
        run: node scripts/sync-index.js --check

      - name: Run tests
        run: node --test
